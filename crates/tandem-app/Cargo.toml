[package]
name = "tandem-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tandem"
path = "src/main.rs"

[features]
test-support = ["gpui-kit/test-support"]

[dependencies]
tandem-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
ignore.workspace = true
gpui-kit.workspace = true
tokio.workspace = true
async-channel.workspace = true
futures.workspace = true
parking_lot.workspace = true
tandem-acp.workspace = true
tandem-quota.workspace = true
tandem-sandbox.workspace = true
tandem-git.workspace = true
tandem-review.workspace = true
tandem-skills.workspace = true
tandem-db.workspace = true
tandem-harness.workspace = true
tandem-terminal.workspace = true
tandem-project.workspace = true
tandem-lsp.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[package.metadata.bundle]
name = "Tandem"
identifier = "dev.tandem.ide"
icon = ["assets/icon/tandem.icns"]
category = "public.app-category.developer-tools"
short_description = "Tandem IDE"
long_description = "Tandem: an IDE for working in tandem with coding agents."
copyright = "Copyright (c) 2026 Tandem contributors"

[package.metadata.bundle.osx]
minimum_system_version = "14.0"
url_schemes = ["tandem"]

# Fonts are embedded via include_bytes!, so no `resources` entry is needed.
